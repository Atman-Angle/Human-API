services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: human-api-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      INVESTIGATION_STORAGE: sqlite
      INVESTIGATION_DB_PATH: /app/.data/investigations.sqlite
    volumes:
      - human-api-data:/app/.data
      - human-api-cache:/app/.cache
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        API_INTERNAL_URL: http://api:3000
    container_name: human-api-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  human-api-data:
  human-api-cache:
